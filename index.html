<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Race | AI 13 | Transcripts & Summary — summaries, transcripts, labs, and visual notes for every module." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Race | AI 13 | Transcripts & Summary</title>

    <!-- Prevent theme flash: apply stored or system preference before first paint -->
    <script>
      (function () {
        var prefix = "ai13:theme";
        var stored = null;
        try { stored = localStorage.getItem(prefix); } catch (_) {}
        var isDark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.classList.toggle("light", !isDark);
      })();
    </script>
  </head>
  <body class="bg-(--color-bg) text-(--color-text) antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
